<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundboard Free</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; padding: 15px; }
        h1 { text-align: center; color: #007bff; margin-bottom: 20px; }
        
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: #1a1a1a; padding: 15px; border-radius: 15px; border: 1px solid #333; justify-content: center; }
        input[type="text"], input[type="file"] { max-width: 200px; }
        input[type="file"]::file-selector-button { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        input[type="file"]::file-selector-button:hover { background: #0056b3; }
        
        #soundGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .sound-card { background: #1e1e1e; padding: 15px; border-radius: 15px; text-align: center; border: 1px solid #333; }
        
        .btn-action { width: 100%; padding: 12px; margin: 4px 0; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .play-btn { background: #27ae60; color: white; }
        .pause-btn { background: #e67e22; color: white; }
        .del-btn { background: #c0392b; color: white; }
        
        .vol-container { display: flex; align-items: center; gap: 8px; margin: 10px 0; justify-content: center; }
        .vol-ctrl-btn { width: 40px; height: 40px; background: #444; border: none; border-radius: 5px; color: white; font-weight: bold; touch-action: manipulation; }
        input[type=range] { flex-grow: 1; accent-color: #007bff; }
    </style>
</head>
<body>

    <h1>Free Use Soundboard</h1>

    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Cari suara..." onkeyup="filterSounds()">
        <input type="file" id="soundFile" accept="audio/*">
        <button onclick="addSound()" style="padding: 10px 20px; background: #007bff; border: none; border-radius: 8px; color: white; cursor: pointer;">Tambah</button>
    </div>

    <div id="soundGrid"></div>

    <script>
        function addSound() {
            const fileInput = document.getElementById('soundFile');
            if (fileInput.files.length === 0) return alert("Pilih file audio!");

            const file = fileInput.files[0];
            const name = file.name.replace(/\.[^/.]+$/, "");
            const audio = new Audio(URL.createObjectURL(file));

            const card = document.createElement('div');
            card.className = 'sound-card';
            card.setAttribute('data-name', name.toLowerCase());

            card.innerHTML = `
                <div style="margin-bottom:10px; font-weight:bold; overflow:hidden; text-overflow:ellipsis;">${name}</div>
                <button class="btn-action play-btn">PLAY</button>
                <button class="btn-action pause-btn">PAUSE</button>
                <div class="vol-container">
                    <button class="vol-ctrl-btn" id="minus">-</button>
                    <input type="range" min="0" max="1" step="0.1" value="1" class="vol-slider">
                    <button class="vol-ctrl-btn" id="plus">+</button>
                </div>
                <button class="btn-action del-btn">HAPUS</button>
            `;

            const slider = card.querySelector('.vol-slider');
            let holdInterval;

            const adjust = (delta) => {
                let vol = Math.min(1, Math.max(0, audio.volume + delta));
                audio.volume = vol;
                slider.value = vol;
            };

            // Gabungan Mouse dan Touch Event agar bisa di Laptop dan HP
            const setupHold = (btn, delta) => {
                const start = () => { adjust(delta); holdInterval = setInterval(() => adjust(delta), 100); };
                const stop = () => clearInterval(holdInterval);
                
                btn.addEventListener('mousedown', start);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
                btn.addEventListener('mouseup', stop);
                btn.addEventListener('mouseleave', stop);
                btn.addEventListener('touchend', stop);
            };

            setupHold(card.querySelector('#minus'), -0.1);
            setupHold(card.querySelector('#plus'), 0.1);

            card.querySelector('.play-btn').onclick = () => audio.play();
            card.querySelector('.pause-btn').onclick = () => audio.pause();
            card.querySelector('.del-btn').onclick = () => { audio.pause(); audio.src = ""; card.remove(); };
            slider.oninput = (e) => { audio.volume = e.target.value; };

            document.getElementById('soundGrid').appendChild(card);
            fileInput.value = "";
        }

        function filterSounds() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.sound-card').forEach(card => {
                card.style.display = card.getAttribute('data-name').includes(query) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
